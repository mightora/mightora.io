name: Deploy Mightora Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/configure-pages@v4
      - name: Install Hugo Extended
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" https://github.com/gohugoio/hugo/releases/download/v0.132.2/hugo_extended_0.132.2_linux-amd64.deb
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Process Markdown includes and refresh legacy cards
        run: |
          python3 .github/workflows/include_md.py .
          python3 .github/workflows/update_cards.py .
      - name: Build site
        env:
          HUGO_ENV: production
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "https://mightora.io/"
      - name: Validate complete rendered catalogue
        run: |
          python3 scripts/validate_toolhub.py
          python3 scripts/check_rendered_toolhub.py
      - name: Bundle shared Mightora footer
        uses: mightora/shared-ui/.github/actions/sync-footer@main
        with:
          output-directory: ./public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
