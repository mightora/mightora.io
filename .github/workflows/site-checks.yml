name: Site catalogue checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_toolhub.py
      - name: Check client and Worker JavaScript syntax
        run: |
          node --check static/js/cloudflare-stats.js
          node --check workers/cloudflare-traffic/src/index.mjs
      - name: Validate YAML
        run: |
          python3 -m pip install pyyaml
          python3 - <<'PY'
          import yaml
          for p in ['data/toolhub.yaml','data/footer.yaml','static/footer.yaml','hugo.yaml']:
              with open(p,encoding='utf8') as f: assert yaml.safe_load(f)
          PY

  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Hugo Extended
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" https://github.com/gohugoio/hugo/releases/download/v0.132.2/hugo_extended_0.132.2_linux-amd64.deb
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Run the production content processors
        run: |
          python3 .github/workflows/include_md.py .
          python3 .github/workflows/update_cards.py .
      - name: Create page artwork
        run: python3 scripts/generate_artwork.py
      - name: Verify Hugo build
        run: hugo --gc --minify --baseURL "https://mightora.io/"
      - name: Generate discovery assets and validate rendered pages
        run: |
          python3 -m pip install pyyaml
          python3 scripts/generate_discovery.py
          python3 scripts/check_rendered_toolhub.py
          python3 scripts/audit_discovery.py

      - name: Browser-rendered screenshots and navigation smoke test
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::warning::Chrome unavailable on runner; browser screenshots skipped"
            exit 0
          fi
          mkdir -p screenshots
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/mightora-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=5000 --screenshot=screenshots/home-desktop.png http://127.0.0.1:8765/
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=5000 --screenshot=screenshots/home-mobile.png http://127.0.0.1:8765/
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=5000 --screenshot=screenshots/code-diff-guide.png http://127.0.0.1:8765/catalogue/code-diff/
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/ > screenshots/home-rendered.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__(); self.tags=[]; self.links=[]
              def handle_starttag(self, tag, attrs):
                  self.tags.append(tag); attrs=dict(attrs)
                  if tag=='a': self.links.append(attrs.get('href', ''))
          p=Inspect(); p.feed(Path('screenshots/home-rendered.html').read_text())
          assert p.tags.count('mightora-footer') == 1
          assert p.tags.count('mightora-author') == 1
          assert '/catalogue/code-diff/' in p.links
          assert '/catalogue/architecture-lab/' in p.links
          print('PASS: Chrome navigation/author/footer smoke check')
          PY
      - name: Save representative browser screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mightora-browser-review
          path: screenshots/
          if-no-files-found: warn
