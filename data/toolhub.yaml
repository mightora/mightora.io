        url: https://architecture-lab.mightora.io/
        description: "Create architecture diagrams."
      - name: "Technology Radar"
        url: https://radar.mightora.io/
        description: "Visualise technology decisions."
      - name: "Roadmaps"
        url: https://roadmaps.mightora.io/
        description: "Plan workstreams and dependencies."
  - id: engagement
    title: "Presentation & engagement"
    icon: present
    description: "Present, share and collect feedback."
    tools:
      - name: "QR Studio"
        url: https://qr.mightora.io/
        description: "Create and customise QR codes."
      - name: "Slides Beta"
        url: https://beta.slides.mightora.io/
        description: "Create interactive presentations."
      - name: "Feedback"
        url: https://feedback.mightora.io/
        description: "Collect presentation feedback."
  - id: connectivity
    title: "Connectivity & utilities"
    icon: connect
    description: "Quick utilities for getting connected."
    tools:
      - name: "Connect"
        url: https://connect.mightora.io/
        description: "Help with device connectivity and Wi-Fi setup."
