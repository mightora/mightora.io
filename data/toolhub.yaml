        url: https://har.mightora.io/
        description: "Analyse browser HAR captures."
      - name: "Code Diff"
        url: https://code-diff.mightora.io/
        description: "Compare code and web files."
  - id: architecture
    title: "Architecture & planning"
    icon: map
    description: "Communicate architecture and plan the future."
