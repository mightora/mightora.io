# Single source of truth: every Mightora tool is grouped by purpose, not hosting type.
# Use a public app URL for hosted apps, or an existing /tools/... page for documented tools.
groups:
  - id: power-bi
    title: "Power BI & analytics"
    icon: chart
    description: "Explore, inspect and compare Power BI assets."
    tools:
      - name: "Power BI Diff"
        url: https://power-bi-diff.mightora.io/
        description: "Compare Power BI assets and spot changes."
      - name: "Semantic Model"
        url: https://semantic-model.mightora.io/
        description: "Explore semantic-model structure."
      - name: "Power BI Inspector"
        url: https://powerbi-inspector.mightora.io/
        description: "Inspect Power BI report components."
      - name: "DAX"
        url: https://dax.mightora.io/
        description: "Work with DAX expressions."
  - id: power-platform
    title: "Power Platform development"
    icon: flow
    description: "Build with Dataverse, web APIs, PCF components and developer utilities."
    tools:
      - name: "Solution Explorer"
        url: https://solution-explorer.mightora.io/
        description: "Explore Dataverse solution components."
      - name: "REST Builder"
        url: https://rest.mightora.io/
        description: "Build and inspect API requests."
      - name: "FetchFlow"
        url: https://fetchflow.mightora.io/
        description: "Work with FetchXML queries."
      - name: "Calculate Elapsed Time"
        url: /tools/pcf/calculate-elapsed-time/
        description: "PCF control for showing elapsed time."
      - name: "iFrame with Split URL"
        url: /tools/pcf/iframe-with-split-url/
        description: "PCF control for handling iframe URLs."
      - name: "Developer Tools Install Script"
        url: /tools/developer/tools-quick-install/
        description: "Get useful developer tooling installed."
  - id: power-automate
    title: "Power Automate & connectors"
    icon: automate
    description: "Build expressions, work with connectors and discover ready-to-use templates."
    tools:
      - name: "Expression Lab"
        url: https://expression-lab.mightora.io/
        description: "Explore Power Automate expressions."
      - name: "Calculate Working Day"
        url: /tools/power-automate-connectors/calculate-working-day/
        description: "Calculate working days in Power Automate."
      - name: "Email Domain Checker"
        url: /tools/power-automate-connectors/email-domain-checker/
        description: "Check email domains with a Power Automate connector."
      - name: "Multi Filter Array"
        url: /tools/power-automate-connectors/multi-filter-array/
        description: "Filter arrays using multiple criteria."
      - name: "Proxy"
        url: /tools/power-automate-connectors/proxy/
        description: "Explore the Proxy connector for Power Automate."
      - name: "Send Email with Graph"
        url: /tools/power-automate-connectors/send-email-with-graph/
        description: "Send email via Microsoft Graph from a flow."
      - name: "SharePoint with Graph"
        url: /tools/power-automate-connectors/sharepoint-with-graph/
        description: "Work with SharePoint through Microsoft Graph."
      - name: "Auto Tag DevOps Tickets into Emails"
        url: /tools/power-automate-templates/auto-tag-devops-tickets-into-emails/
        description: "Power Automate template for linking DevOps tickets with emails."
  - id: devops
    title: "DevOps & ALM"
    icon: rocket
    description: "Automate pipelines, tests, documentation and solution delivery."
    tools:
      - name: "Commit to Repo"
        url: /tools/cicd/commit-to-repo/
        description: "Commit files into a Git repository from delivery pipelines."
      - name: "Dataverse 4 Teams Tools"
        url: /tools/cicd/dataverse-4-teams-tools/
        description: "Explore pipeline utilities for Dataverse for Teams."
      - name: "Power Platform Solution Modifier"
        url: /tools/cicd/power-platform-solution-modifier/
        description: "Adjust Power Platform solutions as part of ALM workflows."
      - name: "Upload Markdown to Wiki"
        url: /tools/cicd/upload-md-to-wiki/
        description: "Publish Markdown documentation to an Azure DevOps wiki."
      - name: "Playwright for Power Platform"
        url: /tools/cicd/playwright-for-power-platform/
        description: "Browser-testing support for Power Platform delivery pipelines."
      - name: "Power Platform Documentation Extension"
        url: /tools/cicd/power-platform-documentation-extension/
        description: "Document Power Platform solution components through developer tooling."
  - id: diagnostics
    title: "Debugging & diagnostics"
    icon: debug
    description: "Investigate network traffic and compare code or web files."
    tools:
      - name: "HAR Analyzer"
        url: https://har.mightora.io/
        description: "Analyse browser HAR captures."
      - name: "Code Diff"
        url: https://code-diff.mightora.io/
        description: "Compare code and web files."
  - id: architecture
    title: "Architecture & planning"
    icon: map
    description: "Model solutions, visualise technology choices and plan delivery."
    tools:
      - name: "Architecture Lab"
        url: https://architecture-lab.mightora.io/
        description: "Create architecture diagrams."
      - name: "Technology Radar"
        url: https://radar.mightora.io/
        description: "Visualise technology decisions."
      - name: "Roadmaps"
        url: https://roadmaps.mightora.io/
        description: "Plan workstreams and dependencies."
  - id: engagement
    title: "Presentation & engagement"
    icon: present
    description: "Present, share information and gather feedback."
    tools:
      - name: "QR Studio"
        url: https://qr.mightora.io/
        description: "Create and customise QR codes."
      - name: "Slides Beta"
        url: https://beta.slides.mightora.io/
        description: "Create interactive presentations."
      - name: "Feedback"
        url: https://feedback.mightora.io/
        description: "Collect presentation feedback."
  - id: connectivity
    title: "Connectivity & utilities"
    icon: connect
    description: "Quick utilities for helping people get connected."
    tools:
      - name: "Connect"
        url: https://connect.mightora.io/
        description: "Help with device connectivity and Wi-Fi setup."
